<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="blob" x1="40" y1="20" x2="280" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="28%" stop-color="#ddd6fe" stop-opacity="0.5"/>
      <stop offset="62%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="clyde" x1="90" y1="90" x2="230" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="shine" cx="38%" cy="32%" r="48%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feOffset dy="10" result="o"/>
      <feFlood flood-color="#1e3a8a" flood-opacity="0.28"/>
      <feComposite in2="o" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <!-- glass sphere -->
    <circle cx="160" cy="160" r="132" fill="url(#blob)"/>
    <circle cx="160" cy="160" r="132" fill="url(#shine)"/>
    <circle cx="160" cy="160" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

    <!-- Discord Clyde mark -->
    <g transform="translate(52 78) scale(1.7)">
      <path
        fill="url(#clyde)"
        d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.22 0A72.37 72.37 0 0 0 45.53 0a105.4 105.4 0 0 0-26.24 8.09C2.79 32.65-1.71 56.6.54 80.21a105.7 105.7 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.03 68.42 68.42 0 0 1-10.85-5.13c.91-.66 1.8-1.34 2.66-2.03a75.57 75.57 0 0 0 64.32 0c.87.7 1.76 1.38 2.66 2.03a68.68 68.68 0 0 1-10.87 5.15 77 77 0 0 0 6.91 11.01 105.4 105.4 0 0 0 32.17-16.12c2.66-27.3-4.53-50.99-18.95-72.13ZM42.45 65.69c-6.2 0-11.31-5.57-11.31-12.42s4.99-12.42 11.31-12.42c6.34 0 11.43 5.63 11.31 12.42 0 6.85-5.01 12.42-11.31 12.42Zm42.1 0c-6.2 0-11.31-5.57-11.31-12.42s4.99-12.42 11.31-12.42c6.34 0 11.43 5.63 11.31 12.42 0 6.85-4.97 12.42-11.31 12.42Z"
      />
